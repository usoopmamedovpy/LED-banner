<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>LED Banner</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- Крестик для сброса -->
        <button class="reset-btn" id="resetBtn">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M18 6L6 18M6 6L18 18" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
            </svg>
        </button>

        <!-- Шестеренка для настроек -->
        <button class="settings-btn" id="settingsBtn">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 15C13.6569 15 15 13.6569 15 12C15 10.3431 13.6569 9 12 9C10.3431 9 9 10.3431 9 12C9 13.6569 10.3431 15 12 15Z" stroke="white" stroke-width="2"/>
                <path d="M19.4 15C18.9 16 18.1 16.7 17.2 17.2L19 20.6L16 21L15.2 18.2C14.3 18.5 13.3 18.6 12.3 18.6C11.3 18.6 10.3 18.5 9.4 18.2L8.6 21L5.6 20.6L7.4 17.2C6.5 16.7 5.7 16 5.2 15L2 15L2 12L5.2 12C5.3 11 5.6 10 6.1 9.2L4.3 5.8L7.3 5.4L8.1 8.2C9 7.9 10 7.7 11 7.7C12 7.7 13 7.8 14 8.1L14.8 5.4L17.8 5.8L16 9.2C16.5 10 16.8 11 16.9 12L20 12L20 15L19.4 15Z" stroke="white" stroke-width="1.5"/>
            </svg>
        </button>

        <!-- Окно настроек -->
        <div class="settings-panel" id="settingsPanel">
            <div class="settings-content">
                <h3>Настройки</h3>
                
                <div class="setting-item">
                    <label>Размер текста</label>
                    <div class="slider-container">
                        <input type="range" id="sizeSlider" min="8" max="20" value="15" step="1" class="slider">
                        <span class="value-display" id="sizeValue">15vw</span>
                    </div>
                </div>

                <div class="setting-item">
                    <label>Скорость</label>
                    <div class="slider-container">
                        <input type="range" id="speedSlider" min="5" max="30" value="15" step="1" class="slider">
                        <span class="value-display" id="speedValue">15 сек</span>
                    </div>
                </div>

                <div class="setting-item">
                    <label>Цвет текста</label>
                    <div class="color-buttons">
                        <button class="color-btn white" data-color="white"></button>
                        <button class="color-btn red" data-color="red"></button>
                        <button class="color-btn blue" data-color="blue"></button>
                        <button class="color-btn green" data-color="green"></button>
                        <button class="color-btn yellow" data-color="yellow"></button>
                    </div>
                </div>
            </div>
        </div>

        <div class="mobile-view">
            <div class="banner-area" id="bannerArea">
                <div class="scrolling-text" id="scrollingText">LED бегущая строка</div>
            </div>
            
            <div class="input-area">
                <input type="text" class="text-input" id="textInput" placeholder="Введите текст..." value="LED бегущая строка" autofocus>
                <button class="run-btn" id="runBtn">RUN</button>
            </div>
        </div>
    </div>

    <!-- Telegram Mini App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="script.js"></script>
</body>
</html>
