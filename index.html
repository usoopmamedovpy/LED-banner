<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <meta name="color-scheme" content="dark">
    <title>LED Banner Math</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- Крестик для показа/скрытия элементов -->
        <button class="reset-btn" id="resetBtn">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                <path d="M18 6L6 18M6 6L18 18" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
            </svg>
        </button>

        <!-- Шестеренка для настроек -->
        <button class="settings-btn" id="settingsBtn">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                <path d="M12 15C13.6569 15 15 13.6569 15 12C15 10.3431 13.6569 9 12 9C10.3431 9 9 10.3431 9 12C9 13.6569 10.3431 15 12 15Z" stroke="white" stroke-width="2"/>
                <path d="M19.4 15C18.9 16 18.1 16.7 17.2 17.2L19 20.6L16 21L15.2 18.2C14.3 18.5 13.3 18.6 12.3 18.6C11.3 18.6 10.3 18.5 9.4 18.2L8.6 21L5.6 20.6L7.4 17.2C6.5 16.7 5.7 16 5.2 15L2 15L2 12L5.2 12C5.3 11 5.6 10 6.1 9.2L4.3 5.8L7.3 5.4L8.1 8.2C9 7.9 10 7.7 11 7.7C12 7.7 13 7.8 14 8.1L14.8 5.4L17.8 5.8L16 9.2C16.5 10 16.8 11 16.9 12L20 12L20 15L19.4 15Z" stroke="white" stroke-width="1.5"/>
            </svg>
        </button>

        <!-- Окно настроек -->
        <div class="settings-panel" id="settingsPanel">
            <div class="settings-content">
                <h3>Настройки</h3>
                
                <div class="setting-item">
                    <label>Размер текста (8-40)</label>
                    <div class="slider-container">
                        <input type="range" id="sizeSlider" min="8" max="40" value="15" step="1" class="slider">
                        <span class="value-display" id="sizeValue">15vw</span>
                    </div>
                </div>

                <div class="setting-item">
                    <label>Скорость (2-30 сек)</label>
                    <div class="slider-container">
                        <input type="range" id="speedSlider" min="2" max="30" value="15" step="1" class="slider">
                        <span class="value-display" id="speedValue">15 сек</span>
                    </div>
                </div>

                <div class="setting-item">
                    <label>Цвет текста</label>
                    <div class="color-buttons">
                        <button class="color-btn white active" data-color="white"></button>
                        <button class="color-btn red" data-color="red"></button>
                        <button class="color-btn blue" data-color="blue"></button>
                        <button class="color-btn green" data-color="green"></button>
                        <button class="color-btn yellow" data-color="yellow"></button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Основной экран -->
        <div class="mobile-view">
            <div class="banner-area">
                <div class="scrolling-text" id="scrollingText">LED бегущая строка</div>
            </div>
            
            <!-- Контейнер для ввода с математической клавиатурой -->
            <div class="input-wrapper">
                <div class="input-area" id="inputArea">
                    <button class="math-btn" id="mathBtn">MATH</button>
                    <input type="text" class="text-input" id="textInput" placeholder="Введите текст..." value="LED бегущая строка" autofocus>
                    <button class="run-btn" id="runBtn">RUN</button>
                </div>
                
                <!-- Математическая клавиатура -->
                <div class="math-keyboard" id="mathKeyboard">
                    <!-- Переключатели разделов (слева) -->
                    <div class="keyboard-sections">
                        <button class="section-btn active" id="sectionFunctions">
                            <span class="section-icon">ƒ(x)</span>
                        </button>
                        <button class="section-btn" id="sectionGreek">
                            <span class="section-icon">Aα</span>
                        </button>
                    </div>
                    
                    <!-- Раздел с функциями и знаками -->
                    <div class="keyboard-section active" id="keyboardFunctions">
                        <div class="keyboard-row">
                            <button class="math-key" data-value="sin">sin</button>
                            <button class="math-key" data-value="cos">cos</button>
                            <button class="math-key" data-value="tan">tan</button>
                            <button class="math-key" data-value="cot">cot</button>
                            <button class="math-key" data-value="sec">sec</button>
                            <button class="math-key" data-value="csc">csc</button>
                        </div>
                        <div class="keyboard-row">
                            <button class="math-key" data-value="arcsin">arcsin</button>
                            <button class="math-key" data-value="arccos">arccos</button>
                            <button class="math-key" data-value="arctan">arctan</button>
                            <button class="math-key" data-value="arccot">arccot</button>
                        </div>
                        <div class="keyboard-row">
                            <button class="math-key" data-value="log">log</button>
                            <button class="math-key" data-value="ln">ln</button>
                            <button class="math-key" data-value="lg">lg</button>
                            <button class="math-key" data-value="exp">e^</button>
                        </div>
                        <div class="keyboard-row">
                            <button class="math-key" data-value="√">√</button>
                            <button class="math-key" data-value="∛">∛</button>
                            <button class="math-key" data-value="∜">∜</button>
                            <button class="math-key" data-value="n√">n√</button>
                        </div>
                        <div class="keyboard-row">
                            <button class="math-key" data-value="^">xⁿ</button>
                            <button class="math-key" data-value="_">xₙ</button>
                            <button class="math-key" data-value="/">/</button>
                            <button class="math-key" data-value="⃗">⃗</button>
                        </div>
                        <div class="keyboard-row">
                            <button class="math-key" data-value="∫">∫</button>
                            <button class="math-key" data-value="∑">∑</button>
                            <button class="math-key" data-value="∏">∏</button>
                            <button class="math-key" data-value="lim">lim</button>
                        </div>
                        <div class="keyboard-row">
                            <button class="math-key" data-value="∞">∞</button>
                            <button class="math-key" data-value="∂">∂</button>
                            <button class="math-key" data-value="∇">∇</button>
                            <button class="math-key" data-value="∀">∀</button>
                        </div>
                        <div class="keyboard-row">
                            <button class="math-key" data-value="∈">∈</button>
                            <button class="math-key" data-value="∉">∉</button>
                            <button class="math-key" data-value="⊂">⊂</button>
                            <button class="math-key" data-value="⊃">⊃</button>
                        </div>
                        <div class="keyboard-row">
                            <button class="math-key" data-value="±">±</button>
                            <button class="math-key" data-value="×">×</button>
                            <button class="math-key" data-value="÷">÷</button>
                            <button class="math-key" data-value="≠">≠</button>
                        </div>
                        <div class="keyboard-row">
                            <button class="math-key" data-value="≤">≤</button>
                            <button class="math-key" data-value="≥">≥</button>
                            <button class="math-key" data-value="≈">≈</button>
                            <button class="math-key" data-value="∝">∝</button>
                        </div>
                    </div>
                    
                    <!-- Раздел с греческими буквами -->
                    <div class="keyboard-section" id="keyboardGreek">
                        <div class="keyboard-row">
                            <button class="math-key" data-value="α">α</button>
                            <button class="math-key" data-value="β">β</button>
                            <button class="math-key" data-value="γ">γ</button>
                            <button class="math-key" data-value="δ">δ</button>
                            <button class="math-key" data-value="ε">ε</button>
                            <button class="math-key" data-value="ζ">ζ</button>
                        </div>
                        <div class="keyboard-row">
                            <button class="math-key" data-value="η">η</button>
                            <button class="math-key" data-value="θ">θ</button>
                            <button class="math-key" data-value="ι">ι</button>
                            <button class="math-key" data-value="κ">κ</button>
                            <button class="math-key" data-value="λ">λ</button>
                            <button class="math-key" data-value="μ">μ</button>
                        </div>
                        <div class="keyboard-row">
                            <button class="math-key" data-value="ν">ν</button>
                            <button class="math-key" data-value="ξ">ξ</button>
                            <button class="math-key" data-value="π">π</button>
                            <button class="math-key" data-value="ρ">ρ</button>
                            <button class="math-key" data-value="σ">σ</button>
                            <button class="math-key" data-value="τ">τ</button>
                        </div>
                        <div class="keyboard-row">
                            <button class="math-key" data-value="υ">υ</button>
                            <button class="math-key" data-value="φ">φ</button>
                            <button class="math-key" data-value="χ">χ</button>
                            <button class="math-key" data-value="ψ">ψ</button>
                            <button class="math-key" data-value="ω">ω</button>
                            <button class="math-key" data-value="Γ">Γ</button>
                        </div>
                        <div class="keyboard-row">
                            <button class="math-key" data-value="Δ">Δ</button>
                            <button class="math-key" data-value="Θ">Θ</button>
                            <button class="math-key" data-value="Λ">Λ</button>
                            <button class="math-key" data-value="Ξ">Ξ</button>
                            <button class="math-key" data-value="Π">Π</button>
                            <button class="math-key" data-value="Σ">Σ</button>
                        </div>
                        <div class="keyboard-row">
                            <button class="math-key" data-value="Φ">Φ</button>
                            <button class="math-key" data-value="Ψ">Ψ</button>
                            <button class="math-key" data-value="Ω">Ω</button>
                            <button class="math-key" data-value=" "> </button>
                            <button class="math-key" data-value=" "> </button>
                            <button class="math-key" data-value=" "> </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Telegram Mini App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="script.js"></script>
</body>
</html>
