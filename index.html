<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <meta name="color-scheme" content="dark">
    <title>LED Banner Math - Гибрид</title>
    
    <!-- MathQuill для отображения -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/mathquill@0.10.1/build/mathquill.css">
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.6.0/dist/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mathquill@0.10.1/build/mathquill.min.js"></script>
    
    <!-- MathJax для бегущей строки -->
    <script>
        window.MathJax = {
            tex: { 
                inlineMath: [['\\(', '\\)']],
                displayMath: [['\\[', '\\]']]
            },
            chtml: { scale: 1 }
        };
    </script>
    <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>
    
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- Кнопки управления -->
        <button class="reset-btn" id="resetBtn">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                <path d="M18 6L6 18M6 6L18 18" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
            </svg>
        </button>
        <button class="donate-btn" id="donateBtn" onclick="window.open('https://www.donationalerts.com/r/usoopmamedovpy', '_blank')">
            <span class="donate-emoji">❤️</span>
        </button>
        <button class="settings-btn" id="settingsBtn">
            <span class="settings-emoji">⚙️</span>
        </button>

        <!-- Настройки -->
        <div class="settings-panel" id="settingsPanel">
            <div class="settings-content">
                <h3>Settings</h3>
                <div class="setting-item">
                    <label>Text size (8-40)</label>
                    <div class="slider-container">
                        <input type="range" id="sizeSlider" min="8" max="40" value="15" step="1" class="slider">
                        <span class="value-display" id="sizeValue">15vw</span>
                    </div>
                </div>
                <div class="setting-item">
                    <label>Speed (2-30 sec)</label>
                    <div class="slider-container">
                        <input type="range" id="speedSlider" min="2" max="30" value="15" step="1" class="slider">
                        <span class="value-display" id="speedValue">15 sec</span>
                    </div>
                </div>
                <div class="setting-item">
                    <label>Text color</label>
                    <div class="color-buttons">
                        <button class="color-btn white active"></button>
                        <button class="color-btn red"></button>
                        <button class="color-btn blue"></button>
                        <button class="color-btn green"></button>
                        <button class="color-btn yellow"></button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Основной экран -->
        <div class="mobile-view">
            <!-- Бегущая строка -->
            <div class="banner-area">
                <div class="scrolling-wrapper">
                    <div class="scrolling-text" id="scrollingText">\(LED\)</div>
                </div>
            </div>
            
            <!-- ГИБРИДНЫЙ РЕДАКТОР -->
            <div class="hybrid-editor-container">
                <!-- Верхний слой: текстовое поле для ввода -->
                <input type="text" class="text-input" id="textInput" placeholder="√[67] or (a)/(b)" value="LED">
                
                <!-- Нижний слой: MathQuill для отображения -->
                <div class="mathquill-display" id="mathDisplay"></div>
            </div>
            
            <!-- Кнопка RUN -->
            <div class="input-area" id="inputArea">
                <button class="math-btn" id="mathBtn">MATH</button>
                <button class="run-btn" id="runBtn">RUN</button>
            </div>
            
            <!-- Математическая клавиатура -->
            <div class="math-keyboard" id="mathKeyboard">
                <div class="keyboard-grid">
                    <button class="math-key" data-symbol="√[ ]">√</button>
                    <button class="math-key" data-symbol="(a)/(b)">a/b</button>
                    <button class="math-key" data-symbol="^">xⁿ</button>
                    <button class="math-key" data-symbol="_">xₙ</button>
                    <button class="math-key" data-symbol="{}">⃗</button>
                    <button class="math-key" data-symbol="∫">∫</button>
                    <button class="math-key" data-symbol="∑">∑</button>
                    <button class="math-key" data-symbol="α">α</button>
                    <button class="math-key" data-symbol="β">β</button>
                    <button class="math-key" data-symbol="γ">γ</button>
                    <button class="math-key" data-symbol="Δ">Δ</button>
                    <button class="math-key" data-symbol="∞">∞</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="script.js"></script>
</body>
</html>
