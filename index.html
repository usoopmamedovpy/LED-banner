<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>LED Banner</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- Крестик для сброса -->
        <button class="reset-btn" id="resetBtn">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M18 6L6 18M6 6L18 18" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
            </svg>
        </button>

        <div class="mobile-view">
            <div class="banner-area" id="bannerArea">
                <div class="scrolling-text" id="scrollingText">LED бегущая строка</div>
            </div>
            
            <div class="input-area">
                <input type="text" class="text-input" id="textInput" placeholder="Введите текст..." value="LED бегущая строка" autofocus>
                <button class="run-btn" id="runBtn">RUN</button>
            </div>
        </div>
    </div>

    <!-- Telegram Mini App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="script.js"></script>
</body>
</html>
