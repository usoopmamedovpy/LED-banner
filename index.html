<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <meta name="color-scheme" content="dark">
    <title>LED Banner Math</title>
    
    <!-- MathQuill -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/mathquill@0.10.1/build/mathquill.css">
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.6.0/dist/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mathquill@0.10.1/build/mathquill.min.js"></script>
    
    <!-- MathJax -->
    <script>
        window.MathJax = {
            tex: { 
                inlineMath: [['\\(', '\\)']],
                displayMath: [['\\[', '\\]']]
            },
            chtml: {
                scale: 1,
                adaptiveCSS: true
            },
            options: {
                enableMenu: false
            }
        };
    </script>
    <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>
    
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-bg-fix"></div>
    <div class="corner-pixel-fix"></div>
    
    <div class="app-container">
        <!-- Крестик -->
        <button class="reset-btn" id="resetBtn">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                <path d="M18 6L6 18M6 6L18 18" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
            </svg>
        </button>

        <!-- Донат -->
        <button class="donate-btn" id="donateBtn" onclick="window.open('https://www.donationalerts.com/r/usoopmamedovpy', '_blank')">
            <span class="donate-emoji">❤️</span>
        </button>

        <!-- Шестеренка -->
        <button class="settings-btn" id="settingsBtn">
            <span class="settings-emoji">⚙️</span>
        </button>

        <!-- Настройки (тексты будут заменены JS) -->
        <div class="settings-panel" id="settingsPanel">
            <div class="settings-content">
                <h3>Settings</h3> <!-- заменится на t.settings -->
                
                <div class="setting-item">
                    <label>Text size (8-40)</label> <!-- заменится на t.textSize -->
                    <div class="slider-container">
                        <input type="range" id="sizeSlider" min="8" max="40" value="15" step="1" class="slider">
                        <span class="value-display" id="sizeValue">15vw</span>
                    </div>
                </div>

                <div class="setting-item">
                    <label>Speed (2-30 sec)</label> <!-- заменится на t.speed -->
                    <div class="slider-container">
                        <input type="range" id="speedSlider" min="2" max="30" value="15" step="1" class="slider">
                        <span class="value-display" id="speedValue">15 sec</span>
                    </div>
                </div>

                <div class="setting-item">
                    <label>Text color</label> <!-- заменится на t.color -->
                    <div class="color-buttons">
                        <button class="color-btn white active"></button>
                        <button class="color-btn red"></button>
                        <button class="color-btn blue"></button>
                        <button class="color-btn green"></button>
                        <button class="color-btn yellow"></button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Основной экран -->
        <div class="mobile-view">
            <div class="banner-area">
                <div class="scrolling-wrapper">
                    <div class="scrolling-text" id="scrollingText">\(LED banner\)</div>
                </div>
            </div>
            
            <div class="input-container">
                <div class="input-area" id="inputArea">
                    <button class="math-btn" id="mathBtn">MATH</button>
                    <div class="math-field" id="mathField"></div>
                    <button class="run-btn" id="runBtn">RUN</button>
                </div>
                
                <div class="math-keyboard" id="mathKeyboard">
                    <!-- ... содержимое клавиатуры ... -->
                </div>
            </div>
        </div>
    </div>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="script.js"></script>
</body>
</html>
