<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Math Runner</title>

<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>

<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui}

body{
background:#111;
color:white;
height:100vh;
overflow:hidden;
display:flex;
justify-content:center;
align-items:center;
}

/* ===== MAIN ===== */

#app{
width:100%;
max-width:900px;
padding:12px;
}

/* ===== TOP BAR ===== */

.top-bar{
display:flex;
justify-content:flex-end;
gap:10px;
margin-bottom:10px;
}

.circle-btn{
width:36px;
height:36px;
border-radius:50%;
border:2px solid white;
background:black;
color:white;
display:flex;
align-items:center;
justify-content:center;
font-size:18px;
cursor:pointer;
}

/* ===== INPUT ROW ===== */

.row{
display:flex;
gap:10px;
align-items:stretch;
}

/* MATH */

#mathPanel{
width:80px;
background:black;
border:2px solid white;
border-radius:14px;
padding:6px;
display:flex;
flex-direction:column;
gap:6px;
overflow-y:auto;
}

.math-key{
background:#222;
border:1px solid white;
border-radius:8px;
color:white;
padding:6px;
text-align:center;
cursor:pointer;
font-size:16px;
}

/* INPUT */

#inputBox{
flex:1;
display:flex;
align-items:center;
background:black;
border:2px solid white;
border-radius:14px;
padding:8px 12px;
}

#textInput{
flex:1;
background:transparent;
border:none;
outline:none;
color:white;
font-size:18px;
}

/* RUN */

#runBtn{
background:white;
color:black;
border-radius:14px;
padding:0 18px;
font-weight:700;
cursor:pointer;
display:flex;
align-items:center;
}

/* ===== SCROLL AREA ===== */

#runner{
margin-top:18px;
position:relative;
height:60px;
overflow:hidden;
border:2px solid white;
border-radius:14px;
background:black;
display:none;
}

#scrollText{
position:absolute;
white-space:nowrap;
font-size:24px;
color:white;
left:0;
top:50%;
transform:translateY(-50%);
}

/* ===== SETTINGS ===== */

#blurLayer{
position:fixed;
inset:0;
backdrop-filter:blur(10px);
display:none;
z-index:10;
}

#settings{
position:fixed;
top:50%;
left:50%;
transform:translate(-50%,-50%);
background:black;
border:2px solid white;
border-radius:16px;
padding:16px;
width:300px;
display:none;
z-index:11;
}

.settings-top{
display:flex;
justify-content:flex-end;
margin-bottom:10px;
}

.slider-block{
margin-bottom:12px;
}

.colors{
display:flex;
gap:10px;
justify-content:center;
margin-top:8px;
}

.color-btn{
width:26px;
height:26px;
border-radius:50%;
border:2px solid white;
cursor:pointer;
}

/* ===== MOBILE ===== */

@media (max-width:600px){
#mathPanel{width:70px}
#scrollText{font-size:18px}
}
</style>
</head>
<body>

<div id="app">

<div class="top-bar">
<div id="settingsBtn" class="circle-btn">⚙️</div>
<div id="closeBtn" class="circle-btn">✕</div>
</div>

<div class="row">

<div id="mathPanel">

<div class="math-key" data-insert="\\alpha">α</div>
<div class="math-key" data-insert="\\beta">β</div>
<div class="math-key" data-insert="\\gamma">γ</div>

<div class="math-key" data-insert="\\sqrt{}">√</div>
<div class="math-key" data-insert="\\frac{}{}">a/b</div>
<div class="math-key" data-insert="^{}">xⁿ</div>

</div>

<div id="inputBox">
<input id="textInput" placeholder="Введите формулу или текст">
</div>

<div id="runBtn">RUN</div>

</div>

<div id="runner">
<div id="scrollText"></div>
</div>

</div>

<!-- SETTINGS -->

<div id="blurLayer"></div>

<div id="settings">

<div class="settings-top">
<div id="closeSettings" class="circle-btn" style="width:28px;height:28px;font-size:14px;background:white;color:black;border:none;">✕</div>
</div>

<div class="slider-block">
Размер текста:
<input id="sizeSlider" type="range" min="8" max="40" value="24">
</div>

<div class="slider-block">
Скорость (сек):
<input id="speedSlider" type="range" min="2" max="30" value="10">
</div>

<div class="colors">
<div class="color-btn" style="background:white" data-color="white"></div>
<div class="color-btn" style="background:red" data-color="red"></div>
<div class="color-btn" style="background:green" data-color="lime"></div>
<div class="color-btn" style="background:yellow" data-color="yellow"></div>
<div class="color-btn" style="background:deepskyblue" data-color="deepskyblue"></div>
</div>

</div>

<script>
const input = document.getElementById("textInput");
const runBtn = document.getElementById("runBtn");
const runner = document.getElementById("runner");
const scrollText = document.getElementById("scrollText");

const closeBtn = document.getElementById("closeBtn");

const settingsBtn = document.getElementById("settingsBtn");
const settings = document.getElementById("settings");
const blur = document.getElementById("blurLayer");
const closeSettings = document.getElementById("closeSettings");

const sizeSlider = document.getElementById("sizeSlider");
const speedSlider = document.getElementById("speedSlider");

let running=false;
let color="white";
let anim;

/* ===== INSERT MATH ===== */

document.querySelectorAll(".math-key").forEach(b=>{
b.onclick=()=>{
insertAtCursor(input,b.dataset.insert);
input.focus();
};
});

function insertAtCursor(input,text){
const start=input.selectionStart;
const end=input.selectionEnd;
const v=input.value;
input.value=v.slice(0,start)+text+v.slice(end);
input.selectionStart=input.selectionEnd=start+text.length-1;
}

/* ===== RUN ===== */

runBtn.onclick=()=>{
if(!input.value.trim())return;

document.querySelector(".row").style.display="none";
settingsBtn.style.display="none";

runner.style.display="block";

renderMath();
startScroll();

running=true;
};

closeBtn.onclick=()=>{
if(!running)return;

cancelAnimationFrame(anim);

document.querySelector(".row").style.display="flex";
settingsBtn.style.display="flex";

runner.style.display="none";

running=false;
};

/* ===== SCROLL ===== */

function startScroll(){

scrollText.style.fontSize=sizeSlider.value+"px";
scrollText.style.color=color;

let container=runner.clientWidth;
let textWidth=scrollText.scrollWidth;

let x=container;

let duration=+speedSlider.value*1000;
let total=container+textWidth;
let speed=total/duration;

let last=null;

function frame(t){
if(!last) last=t;
let dt=t-last;
last=t;

x-=speed*dt;
scrollText.style.transform="translate("+x+"px,-50%)";

if(x<-textWidth) x=container;

anim=requestAnimationFrame(frame);
}

anim=requestAnimationFrame(frame);
}

/* ===== MATHJAX ===== */

function renderMath(){
scrollText.innerHTML="\\("+input.value+"\\)";
MathJax.typesetPromise([scrollText]);
}

/* ===== SETTINGS ===== */

settingsBtn.onclick=()=>{
blur.style.display="block";
settings.style.display="block";
};

closeSettings.onclick=()=>{
blur.style.display="none";
settings.style.display="none";
};

sizeSlider.oninput=()=>{
scrollText.style.fontSize=sizeSlider.value+"px";
};

speedSlider.oninput=()=>{
if(running){
cancelAnimationFrame(anim);
startScroll();
}
};

document.querySelectorAll(".color-btn").forEach(c=>{
c.onclick=()=>{
color=c.dataset.color;
scrollText.style.color=color;
};
});
</script>
</body>
</html>
