<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>LED Banner</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Мобильная версия (всегда видна) -->
        <div class="mobile-view">
            <div class="banner-area" id="bannerArea">
                <div class="scrolling-text" id="scrollingText">LED бегущая строка</div>
            </div>
            
            <div class="input-area">
                <input type="text" class="text-input" id="textInput" placeholder="Введите текст..." value="LED бегущая строка" autofocus>
                <button class="run-btn" id="runBtn">RUN</button>
            </div>
        </div>
    </div>

    <!-- Telegram Mini App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="script.js"></script>
</body>
</html>
