<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Math Scroller</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/mathquill/0.10.1/mathquill.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/mathquill/0.10.1/mathquill.min.js"></script>

<script>
window.MathJax = {
  tex:{inlineMath:[['\\(','\\)']]},
  svg:{fontCache:'global'}
};
</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:black;
  font-family:Arial, sans-serif;
  color:white;
  overflow:hidden;
}

/* ---------- бегущая строка ---------- */

#ticker{
  position:fixed;
  top:50%;
  left:100%;
  transform:translateY(-50%);
  white-space:nowrap;
  font-size:24px;
  pointer-events:none;
  z-index:1;
}

#ticker mjx-container *{
  fill:currentColor !important;
  color:inherit !important;
}

/* ---------- верхние кнопки ---------- */

#topBar{
  position:fixed;
  right:12px;
  top:12px;
  display:flex;
  gap:10px;
  z-index:20;
}

.circle{
  width:38px;
  height:38px;
  border-radius:50%;
  border:2px solid white;
  background:black;
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  font-size:18px;
  user-select:none;
}

/* ---------- нижняя панель ---------- */

#bottomBar{
  position:fixed;
  left:0;
  right:0;
  bottom:10px;
  display:flex;
  justify-content:center;
  z-index:10;
}

#panel{
  display:flex;
  gap:8px;
  padding:8px;
  max-width:100%;
  width:100%;
  justify-content:center;
  align-items:stretch;
  flex-wrap:wrap;
}

/* ---------- MATH ---------- */

#mathPanel{
  background:black;
  border:2px solid white;
  border-radius:10px;
  padding:6px;
  display:flex;
  gap:6px;
  flex-wrap:wrap;
  max-width:160px;
}

.mathBtn{
  border:1px solid white;
  border-radius:6px;
  background:black;
  color:white;
  padding:4px 6px;
  font-size:14px;
  cursor:pointer;
}

/* ---------- поле ---------- */

#inputWrap{
  min-width:200px;
  max-width:90vw;
  background:black;
  border:2px solid white;
  border-radius:10px;
  padding:8px 10px;
}

#mathInput{
  min-height:28px;
}

/* MathQuill */

.mq-editable-field{
  border:none !important;
  color:white !important;
}

.mq-root-block{
  line-height:1.4;
}

/* ---------- RUN ---------- */

#runBtn{
  background:white;
  color:black;
  border:none;
  border-radius:10px;
  padding:8px 16px;
  font-weight:bold;
  cursor:pointer;
}

/* ---------- настройки ---------- */

#settingsOverlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.4);
  backdrop-filter:blur(6px);
  display:none;
  z-index:30;
}

#settingsBox{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  background:black;
  border:2px solid white;
  border-radius:12px;
  width:280px;
  padding:14px;
}

#settingsBox h3{
  margin:0 0 10px 0;
  text-align:center;
}

#closeSettings{
  position:absolute;
  right:8px;
  top:8px;
  width:22px;
  height:22px;
  border-radius:50%;
  background:white;
  color:black;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  font-size:14px;
}

.settingRow{
  margin-bottom:10px;
  font-size:14px;
}

.colors{
  display:flex;
  gap:10px;
  justify-content:center;
}

.colorDot{
  width:26px;
  height:26px;
  border-radius:50%;
  border:2px solid white;
  cursor:pointer;
}

/* ---------- скрытие UI ---------- */

.hidden{
  display:none !important;
}
</style>
</head>
<body>

<div id="ticker">Введите формулу…</div>

<div id="topBar">
  <div id="closeAll" class="circle">✕</div>
  <div id="openSettings" class="circle">⚙</div>
</div>

<div id="bottomBar">
  <div id="panel">

    <div id="mathPanel">
      <div class="mathBtn" data-cmd="sqrt">√</div>
      <div class="mathBtn" data-cmd="frac">a/b</div>
      <div class="mathBtn" data-cmd="vec">→</div>
      <div class="mathBtn" data-text="\\alpha">α</div>
      <div class="mathBtn" data-text="\\beta">β</div>
      <div class="mathBtn" data-text="\\gamma">γ</div>
    </div>

    <div id="inputWrap">
      <div id="mathInput"></div>
    </div>

    <button id="runBtn">RUN</button>

  </div>
</div>

<!-- настройки -->

<div id="settingsOverlay">
  <div id="settingsBox">

    <div id="closeSettings">✕</div>

    <h3>Настройки</h3>

    <div class="settingRow">
      Размер текста
      <input id="sizeRange" type="range" min="8" max="40" value="24">
    </div>

    <div class="settingRow">
      Скорость (сек)
      <input id="speedRange" type="range" min="2" max="30" value="10">
    </div>

    <div class="colors">
      <div class="colorDot" data-color="white" style="background:white"></div>
      <div class="colorDot" data-color="red" style="background:red"></div>
      <div class="colorDot" data-color="lime" style="background:lime"></div>
      <div class="colorDot" data-color="yellow" style="background:yellow"></div>
      <div class="colorDot" data-color="dodgerblue" style="background:dodgerblue"></div>
    </div>

  </div>
</div>

<script>
const MQ = MathQuill.getInterface(2);

const mathInput = document.getElementById("mathInput");
const ticker = document.getElementById("ticker");

const mathField = MQ.MathField(mathInput,{
  handlers:{
    edit(){
      updateTicker();
    }
  }
});

let fontSize = 24;
let speed = 10;
let color = "white";

let running = false;
let raf;
let posX = window.innerWidth;

/* ---------- ticker ---------- */

function updateTicker(){
  const latex = mathField.latex().trim();

  if(!latex){
    ticker.textContent = "Введите формулу…";
    return;
  }

  ticker.innerHTML = "\\(" + latex + "\\)";
  MathJax.typesetClear([ticker]);
  MathJax.typesetPromise([ticker]);
}

function startTicker(){
  cancelAnimationFrame(raf);
  posX = window.innerWidth;

  function loop(){
    const pxPerFrame = window.innerWidth / (speed * 60);
    posX -= pxPerFrame;
    ticker.style.left = posX + "px";

    if(posX < -ticker.offsetWidth){
      posX = window.innerWidth;
    }

    raf = requestAnimationFrame(loop);
  }

  loop();
}

/* ---------- кнопки формул ---------- */

document.querySelectorAll(".mathBtn").forEach(btn=>{
  btn.addEventListener("click",()=>{
    mathField.focus();

    const cmd = btn.dataset.cmd;
    const text = btn.dataset.text;

    if(cmd === "sqrt"){
      mathField.cmd("\\sqrt");
    }
    else if(cmd === "frac"){
      mathField.cmd("\\frac");
    }
    else if(cmd === "vec"){
      mathField.cmd("\\vec");
    }
    else if(text){
      mathField.write(text);
    }
  });
});

/* ---------- RUN ---------- */

document.getElementById("runBtn").addEventListener("click",()=>{
  running = true;

  document.getElementById("bottomBar").classList.add("hidden");
  document.getElementById("openSettings").classList.add("hidden");

  startTicker();
});

/* ---------- крестик ---------- */

document.getElementById("closeAll").addEventListener("click",()=>{

  if(running){
    running = false;
    document.getElementById("bottomBar").classList.remove("hidden");
    document.getElementById("openSettings").classList.remove("hidden");
    cancelAnimationFrame(raf);
    return;
  }

  mathField.latex("");
  updateTicker();
});

/* ---------- настройки ---------- */

const overlay = document.getElementById("settingsOverlay");

document.getElementById("openSettings").onclick = ()=>{
  overlay.style.display="block";
};

document.getElementById("closeSettings").onclick = ()=>{
  overlay.style.display="none";
};

document.getElementById("sizeRange").oninput = e=>{
  fontSize = e.target.value;
  ticker.style.fontSize = fontSize+"px";
};

document.getElementById("speedRange").oninput = e=>{
  speed = e.target.value;
};

document.querySelectorAll(".colorDot").forEach(dot=>{
  dot.onclick = ()=>{
    color = dot.dataset.color;
    ticker.style.color = color;
  };
});

/* ---------- init ---------- */

ticker.style.fontSize = fontSize+"px";
ticker.style.color = color;
updateTicker();
</script>

</body>
</html>
