<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <meta name="color-scheme" content="dark">
    <title>LED Banner Math</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/mathquill@0.10.1/build/mathquill.css">
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.6.0/dist/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mathquill@0.10.1/build/mathquill.min.js"></script>

    <script>
        window.MathJax = {
            tex: { inlineMath: [['\\(', '\\)']], displayMath: [['\\[', '\\]']] },
            chtml: { scale: 1, adaptiveCSS: true },
            options: { enableMenu: false }
        };
    </script>
    <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-bg-fix"></div>
    <div class="corner-pixel-fix"></div>

    <div class="app-container">
        <button class="reset-btn" id="resetBtn">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                <path d="M18 6L6 18M6 6L18 18" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
            </svg>
        </button>

        <button class="donate-btn" id="donateBtn" onclick="window.open('https://www.donationalerts.com/r/usoopmamedovpy', '_blank')">
            <span class="donate-emoji">❤️</span>
        </button>

        <button class="settings-btn" id="settingsBtn">
            <span class="settings-emoji">⚙️</span>
        </button>

        <div class="settings-panel" id="settingsPanel">
            <div class="settings-content">
                <h3>Settings</h3>
                <div class="setting-item">
                    <label>Text size (8-40)</label>
                    <div class="slider-container">
                        <input type="range" id="sizeSlider" min="8" max="40" value="15" step="1" class="slider">
                        <span class="value-display" id="sizeValue">15vw</span>
                    </div>
                </div>
                <div class="setting-item">
                    <label>Speed (2-30 sec)</label>
                    <div class="slider-container">
                        <input type="range" id="speedSlider" min="2" max="30" value="15" step="1" class="slider">
                        <span class="value-display" id="speedValue">15 sec</span>
                    </div>
                </div>

                <div class="setting-item font-picker-item">
                    <label>Font Family</label>
                    <div class="fonts-container">
                        <div class="fonts-grid" id="fontsGrid"></div>
                    </div>
                </div>

                <div class="setting-item color-picker-item">
                    <label>Text color</label>

                    <div class="color-preview" id="colorPreview"></div>

                    <div class="color-palette-container">
                        <canvas id="colorPalette" class="color-palette"></canvas>
                        <div class="palette-indicator" id="paletteIndicator"></div>
                    </div>

                    <div class="hue-slider-container">
                        <canvas id="hueBar" class="hue-bar"></canvas>
                        <input type="range" id="hueSlider" min="0" max="300" value="0" step="1" class="hue-slider">
                    </div>

                    <div class="shades-container">
                        <div class="shades-scroll" id="shadesScroll"></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="mobile-view">
            <div class="banner-area">
                <div class="scrolling-wrapper">
                    <div class="scrolling-text" id="scrollingText">\(LED banner\)</div>
                </div>
            </div>

            <div class="input-container">
                <div class="input-area" id="inputArea">
                    <button class="math-btn" id="mathBtn">MATH</button>
                    <div class="math-field" id="mathField"></div>
                    <button class="run-btn" id="runBtn">RUN</button>
                </div>

                <div class="math-keyboard" id="mathKeyboard">
                    <div class="keyboard-tabs">
                        <button class="tab-btn active" id="tabFunctions">ƒ(x)</button>
                        <button class="tab-btn" id="tabGreek">Aα</button>
                        <button class="tab-btn" id="tabSymbols">∫∑</button>
                        <button class="tab-btn" id="tabPhysics">⚛️</button>
                    </div>

                    <div class="tab-content active" id="functionsTab">
                        <div class="keyboard-grid">
                            <button class="math-key" data-cmd="\sin">sin</button>
                            <button class="math-key" data-cmd="\cos">cos</button>
                            <button class="math-key" data-cmd="\tan">tan</button>
                            <button class="math-key" data-cmd="\cot">cot</button>
                            <button class="math-key" data-cmd="\arcsin">arcsin</button>
                            <button class="math-key" data-cmd="\arccos">arccos</button>
                            <button class="math-key" data-cmd="\arctan">arctan</button>
                            <button class="math-key" data-cmd="\arccot">arccot</button>
                            <button class="math-key" data-cmd="\log">log</button>
                            <button class="math-key" data-cmd="\ln">ln</button>
                            <button class="math-key" data-cmd="\lg">lg</button>
                            <button class="math-key" data-cmd="\exp">exp</button>
                            <button class="math-key" data-cmd="\sqrt">√</button>
                            <button class="math-key" data-cmd="\sqrt[3]">∛</button>
                            <button class="math-key" data-cmd="\sqrt[4]">∜</button>
                            <button class="math-key" data-cmd="\sqrt[n]">n√</button>
                            <button class="math-key" data-cmd="\frac">a/b</button>
                            <button class="math-key" data-cmd="^">xⁿ</button>
                            <button class="math-key" data-cmd="_">xₙ</button>
                            <button class="math-key" data-cmd="\vec">⃗</button>
                            <button class="math-key" data-cmd="\int">∫</button>
                            <button class="math-key" data-cmd="\sum">∑</button>
                            <button class="math-key" data-cmd="\prod">∏</button>
                            <button class="math-key" data-cmd="\lim">lim</button>
                        </div>
                    </div>

                    <div class="tab-content" id="greekTab">
                        <div class="keyboard-grid">
                            <button class="math-key" data-cmd="\alpha">α</button>
                            <button class="math-key" data-cmd="\beta">β</button>
                            <button class="math-key" data-cmd="\gamma">γ</button>
                            <button class="math-key" data-cmd="\delta">δ</button>
                            <button class="math-key" data-cmd="\epsilon">ε</button>
                            <button class="math-key" data-cmd="\zeta">ζ</button>
                            <button class="math-key" data-cmd="\eta">η</button>
                            <button class="math-key" data-cmd="\theta">θ</button>
                            <button class="math-key" data-cmd="\iota">ι</button>
                            <button class="math-key" data-cmd="\kappa">κ</button>
                            <button class="math-key" data-cmd="\lambda">λ</button>
                            <button class="math-key" data-cmd="\mu">μ</button>
                            <button class="math-key" data-cmd="\nu">ν</button>
                            <button class="math-key" data-cmd="\xi">ξ</button>
                            <button class="math-key" data-cmd="\pi">π</button>
                            <button class="math-key" data-cmd="\rho">ρ</button>
                            <button class="math-key" data-cmd="\sigma">σ</button>
                            <button class="math-key" data-cmd="\tau">τ</button>
                            <button class="math-key" data-cmd="\upsilon">υ</button>
                            <button class="math-key" data-cmd="\phi">φ</button>
                            <button class="math-key" data-cmd="\chi">χ</button>
                            <button class="math-key" data-cmd="\psi">ψ</button>
                            <button class="math-key" data-cmd="\omega">ω</button>
                            <button class="math-key" data-cmd="\Delta">Δ</button>
                        </div>
                    </div>

                    <div class="tab-content" id="symbolsTab">
                        <div class="keyboard-grid">
                            <button class="math-key" data-cmd="\infty">∞</button>
                            <button class="math-key" data-cmd="\partial">∂</button>
                            <button class="math-key" data-cmd="\nabla">∇</button>
                            <button class="math-key" data-cmd="\forall">∀</button>
                            <button class="math-key" data-cmd="\exists">∃</button>
                            <button class="math-key" data-cmd="\in">∈</button>
                            <button class="math-key" data-cmd="\notin">∉</button>
                            <button class="math-key" data-cmd="\subset">⊂</button>
                            <button class="math-key" data-cmd="\supset">⊃</button>
                            <button class="math-key" data-cmd="\cup">∪</button>
                            <button class="math-key" data-cmd="\cap">∩</button>
                            <button class="math-key" data-cmd="\pm">±</button>
                            <button class="math-key" data-cmd="\times">×</button>
                            <button class="math-key" data-cmd="\div">÷</button>
                            <button class="math-key" data-cmd="\neq">≠</button>
                            <button class="math-key" data-cmd="\leq">≤</button>
                            <button class="math-key" data-cmd="\geq">≥</button>
                            <button class="math-key" data-cmd="\approx">≈</button>
                            <button class="math-key" data-cmd="\propto">∝</button>
                        </div>
                    </div>

                    <div class="tab-content" id="physicsTab">
                        <div class="physics-subtabs">
                            <button class="physics-subtab-btn active" data-phys-cat="mechanics">🚗</button>
                            <button class="physics-subtab-btn" data-phys-cat="optics">👓</button>
                            <button class="physics-subtab-btn" data-phys-cat="nuclear">⚛️</button>
                        </div>

                        <div class="physics-category active" id="phys-mechanics">
                            <div class="keyboard-grid">
                                <button class="math-key" data-formula="v = v_0_ + at">v = v_0_ + at</button>
                                <button class="math-key" data-formula="s = v_0_t + (at^2^/2) = (v_0_ + v/2)·t = (v^2^ - v_0_^2^/2a)">s = v_0_t + (at^2^/2)</button>
                                <button class="math-key" data-formula="v^2^ = v_0_^2^ + 2as">v^2^ = v_0_^2^ + 2as</button>
                                <button class="math-key" data-formula="F = ma = (Δ p/Δ t)">F = ma = (Δ p/Δ t)</button>
                                <button class="math-key" data-formula="p = mv">p = mv</button>
                                <button class="math-key" data-formula="E_k_ = (mv^2^/2) = (p^2^/2m)">E_k_ = (mv^2^/2) = (p^2^/2m)</button>
                                <button class="math-key" data-formula="E_p_ = mgh">E_p_ = mgh</button>
                                <button class="math-key" data-formula="F = G·(m_1_m_2_/r^2^)">F = G·(m_1_m_2_/r^2^)</button>
                                <button class="math-key" data-formula="ω = (Δ φ/Δ t) = (2π/T) = 2π·f">ω = (Δ φ/Δ t) = (2π/T) = 2π·f</button>
                                <button class="math-key" data-formula="v = ω·R">v = ω·R</button>
                                <button class="math-key" data-formula="a_c_ = (v^2^/R) = ω^2^R">a_c_ = (v^2^/R) = ω^2^R</button>
                                <button class="math-key" data-formula="x = A·sin(ω·t + φ_0_)">x = A·sin(ω·t + φ_0_)</button>
                                <button class="math-key" data-formula="T = 2π√[(m/k)] = (2π/ω)">T = 2π√[(m/k)] = (2π/ω)</button>
                                <button class="math-key" data-formula="T = 2π√[l/g] = (2π/ω)">T = 2π√[l/g] = (2π/ω)</button>
                                <button class="math-key" data-formula="x = v_0_·cosα·t">x = v_0_·cosα·t</button>
                                <button class="math-key" data-formula="y = v_0_·sinα·t - (gt^2^/2)">y = v_0_·sinα·t - (gt^2^/2)</button>
                                <button class="math-key" data-formula="H_max_ = (v_0_²·sin²α/2g)">H_max_ = (v_0_²·sin²α/2g)</button>
                                <button class="math-key" data-formula="L = (v_0_²·sin2α/g)">L = (v_0_²·sin2α/g)</button>
                                <button class="math-key" data-formula="h = v_0_t - (gt^2^/2)">h = v_0_t - (gt^2^/2)</button>
                                <button class="math-key" data-formula="H_max_ = (v_0_²/2g)">H_max_ = (v_0_²/2g)</button>
                                <button class="math-key" data-formula="ω = √[(k/m)] = (2π/T)">ω = √[(k/m)] = (2π/T)</button>
                                <button class="math-key" data-formula="E = (kA^2^/2) = (mv_max_^2^/2)">E = (kA^2^/2) = (mv_max_^2^/2)</button>
                            </div>
                        </div>

                        <div class="physics-category" id="phys-optics">
                            <div class="keyboard-grid">
                                <button class="math-key" data-formula="(1/f) = (1/d_o_) + (1/d_i_) = (n-1)·(1/R_1_ - 1/R_2_)">(1/f) = (1/d_o_) + (1/d_i_)</button>
                                <button class="math-key" data-formula="M = (-d_i_/d_o_) = (h_i_/h_o_)">M = (-d_i_/d_o_) = (h_i_/h_o_)</button>
                                <button class="math-key" data-formula="n = (c/v) = (λ_0_/λ)">n = (c/v) = (λ_0_/λ)</button>
                                <button class="math-key" data-formula="n_1_·sinθ_1_ = n_2_·sinθ_2_">n_1_·sinθ_1_ = n_2_·sinθ_2_</button>
                                <button class="math-key" data-formula="θ_c_ = arcsin(n_2_/n_1_)">θ_c_ = arcsin(n_2_/n_1_)</button>
                                <button class="math-key" data-formula="λ = (c/f) = (v/f)">λ = (c/f) = (v/f)</button>
                                <button class="math-key" data-formula="E = hf = (hc/λ) = pc">E = hf = (hc/λ) = pc</button>
                                <button class="math-key" data-formula="d·sinθ = mλ">d·sinθ = mλ</button>
                                <button class="math-key" data-formula="I = I_0_·cos²θ">I = I_0_·cos²θ</button>
                            </div>
                        </div>

                        <div class="physics-category" id="phys-nuclear">
                            <div class="keyboard-grid">
                                <button class="math-key" data-formula="E = mc² = √[p²c² + m_0_²c⁴]">E = mc² = √[p²c² + m_0_²c⁴]</button>
                                <button class="math-key" data-formula="Δ E = Δ m·c²">Δ E = Δ m·c²</button>
                                <button class="math-key" data-formula="N = N_0_·e^-λ·t^ = N_0_·2^-t/T_1/2_^">N = N_0_·e^-λ·t^ = N_0_·2^-t/T_1/2_^</button>
                                <button class="math-key" data-formula="T_1/2_ = (ln(2)/λ) = τ·ln(2)">T_1/2_ = (ln(2)/λ) = τ·ln(2)</button>
                                <button class="math-key" data-formula="A = λ·N = A_0_·e^-λ·t^">A = λ·N = A_0_·e^-λ·t^</button>
                                <button class="math-key" data-formula="Q = (m_i_ - m_f_)c²">Q = (m_i_ - m_f_)c²</button>
                                <button class="math-key" data-formula="E_b_ = Δ m·c² = (Z·m_p_ + N·m_n_ - m_яд)·c²">E_b_ = Δ m·c²</button>
                                <button class="math-key" data-formula="R = R_0_·A^(1/3)^">R = R_0_·A^(1/3)^</button>
                                <button class="math-key" data-formula="{}^{235}U + n → {}^{141}Ba + {}^{92}Kr + 3n">{}^{235}U + n → {}^{141}Ba + {}^{92}Kr + 3n</button>
                                <button class="math-key" data-formula="{}^{2}H + {}^{3}H → {}^{4}He + n">{}^{2}H + {}^{3}H → {}^{4}He + n</button>
                                <button class="math-key" data-formula="λ = (ln(2)/T_(1/2)_) = (1/τ)">λ = (ln(2)/T_1/2_) = (1/τ)</button>
                                <button class="math-key" data-formula="p = (h/λ) = (E/c) = √[2mE_k_]">p = (h/λ) = (E/c) = √[2mE_k_]</button>
                                <button class="math-key" data-formula="λ = (h/p) = h/√[2mE_k_]">λ = (h/p) = h/√[2mE_k_]</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="script.js"></script>
</body>
</html>
