<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>LED Banner Math</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/mathquill@0.10.1/build/mathquill.css">
<script src="https://cdn.jsdelivr.net/npm/jquery@3.6.0/dist/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mathquill@0.10.1/build/mathquill.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>

<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app-container">

<button class="reset-btn" id="resetBtn">✕</button>
<button class="settings-btn" id="settingsBtn">⚙</button>

<div class="settings-panel" id="settingsPanel">
  <div class="settings-content">

    <h3>Настройки</h3>

    <div class="setting-item">
      <label>Размер</label>
      <div class="slider-container">
        <input type="range" id="sizeSlider" min="8" max="40" value="15">
        <span id="sizeValue">15vw</span>
      </div>
    </div>

    <div class="setting-item">
      <label>Скорость</label>
      <div class="slider-container">
        <input type="range" id="speedSlider" min="2" max="30" value="15">
        <span id="speedValue">15 сек</span>
      </div>
    </div>

    <div class="setting-item">
      <label>Цвет</label>
      <div class="color-buttons">
        <button class="color-btn white active"></button>
        <button class="color-btn red"></button>
        <button class="color-btn blue"></button>
        <button class="color-btn green"></button>
        <button class="color-btn yellow"></button>
      </div>
    </div>

  </div>
</div>

<div class="mobile-view">

  <div class="banner-area">
    <div class="scrolling-text" id="scrollingText"></div>
  </div>

  <div class="input-container">

    <div class="input-area" id="inputArea">
      <button class="math-btn" id="mathBtn">MATH</button>
      <div class="math-field" id="mathField"></div>
      <button class="run-btn" id="runBtn">RUN</button>
    </div>

    <div class="math-keyboard" id="mathKeyboard">

      <div class="keyboard-tabs">
        <button class="tab-btn active" id="tabFunctions">ƒ(x)</button>
        <button class="tab-btn" id="tabGreek">αβ</button>
        <button class="tab-btn" id="tabSymbols">∫∑</button>
      </div>

      <!-- functions -->
      <div class="tab-content active" id="functionsTab">
        <div class="keyboard-grid">
          <button class="math-key" data-cmd="\sin">sin</button>
          <button class="math-key" data-cmd="\cos">cos</button>
          <button class="math-key" data-cmd="\tan">tan</button>
          <button class="math-key" data-cmd="\log">log</button>

          <button class="math-key" data-cmd="\sqrt">√</button>
          <button class="math-key" data-cmd="\frac">a/b</button>
          <button class="math-key" data-cmd="^">xⁿ</button>
          <button class="math-key" data-cmd="_">xₙ</button>

          <button class="math-key" data-cmd="\vec">⃗</button>
          <button class="math-key" data-cmd="\int">∫</button>
          <button class="math-key" data-cmd="\sum">∑</button>
          <button class="math-key" data-cmd="\prod">∏</button>
        </div>
      </div>

      <!-- greek -->
      <div class="tab-content" id="greekTab">
        <div class="keyboard-grid">
          <button class="math-key" data-cmd="\alpha">α</button>
          <button class="math-key" data-cmd="\beta">β</button>
          <button class="math-key" data-cmd="\gamma">γ</button>
          <button class="math-key" data-cmd="\delta">δ</button>
          <button class="math-key" data-cmd="\theta">θ</button>
          <button class="math-key" data-cmd="\lambda">λ</button>
          <button class="math-key" data-cmd="\mu">μ</button>
          <button class="math-key" data-cmd="\pi">π</button>
        </div>
      </div>

      <!-- symbols -->
      <div class="tab-content" id="symbolsTab">
        <div class="keyboard-grid">
          <button class="math-key" data-cmd="\infty">∞</button>
          <button class="math-key" data-cmd="\neq">≠</button>
          <button class="math-key" data-cmd="\leq">≤</button>
          <button class="math-key" data-cmd="\geq">≥</button>
        </div>
      </div>

    </div>

  </div>

</div>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="script.js"></script>

</body>
</html>
