<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <meta name="color-scheme" content="dark">
    <title>LED Banner - Идеальный</title>
    
    <!-- MathQuill для рендера -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/mathquill@0.10.1/build/mathquill.css">
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.6.0/dist/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mathquill@0.10.1/build/mathquill.min.js"></script>
    
    <!-- MathJax для бегущей строки -->
    <script>
        window.MathJax = {
            tex: { inlineMath: [['\\(', '\\)']] },
            chtml: { scale: 1 }
        };
    </script>
    <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>
    
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- Кнопки управления (всегда сверху) -->
        <button class="reset-btn" id="resetBtn">✕</button>
        <button class="donate-btn" id="donateBtn">❤️</button>
        <button class="settings-btn" id="settingsBtn">⚙️</button>

        <!-- Настройки -->
        <div class="settings-panel" id="settingsPanel">
            <div class="settings-content">
                <h3>Settings</h3>
                <div class="setting-item">
                    <label>Text size (8-40)</label>
                    <div class="slider-container">
                        <input type="range" id="sizeSlider" min="8" max="40" value="15" step="1">
                        <span class="value-display" id="sizeValue">15vw</span>
                    </div>
                </div>
                <div class="setting-item">
                    <label>Speed (2-30 sec)</label>
                    <div class="slider-container">
                        <input type="range" id="speedSlider" min="2" max="30" value="15" step="1">
                        <span class="value-display" id="speedValue">15 sec</span>
                    </div>
                </div>
                <div class="setting-item">
                    <label>Text color</label>
                    <div class="color-buttons">
                        <button class="color-btn white active"></button>
                        <button class="color-btn red"></button>
                        <button class="color-btn blue"></button>
                        <button class="color-btn green"></button>
                        <button class="color-btn yellow"></button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Основной экран -->
        <div class="mobile-view">
            <!-- Бегущая строка (во всю ширину) -->
            <div class="banner-area">
                <div class="scrolling-text" id="scrollingText">\(LED\)</div>
            </div>
            
            <!-- Контейнер с наложением (по центру) -->
            <div class="overlay-container" id="overlayContainer">
                <!-- Задний план: красивый рендер MathQuill -->
                <div class="render-layer" id="renderLayer"></div>
                
                <!-- Передний план: поле ввода (текст виден) -->
                <input 
                    type="text" 
                    class="input-layer" 
                    id="inputField" 
                    value="LED"
                    autofocus
                >
            </div>
            
            <!-- Нижняя панель с MATH и RUN -->
            <div class="bottom-panel">
                <button class="math-btn" id="mathBtn">MATH</button>
                <button class="run-btn" id="runBtn">RUN</button>
            </div>
            
            <!-- Клавиатура-помощник -->
            <div class="math-keyboard" id="mathKeyboard">
                <div class="keyboard-grid">
                    <button class="math-key" data-cmd="√[]">√</button>
                    <button class="math-key" data-cmd="(a)/(b)">a/b</button>
                    <button class="math-key" data-cmd="^">ⁿ</button>
                    <button class="math-key" data-cmd="_">ₙ</button>
                    <button class="math-key" data-cmd="{}">⃗</button>
                    <button class="math-key" data-cmd="∫">∫</button>
                    <button class="math-key" data-cmd="∑">∑</button>
                    <button class="math-key" data-cmd="α">α</button>
                    <button class="math-key" data-cmd="β">β</button>
                    <button class="math-key" data-cmd="γ">γ</button>
                    <button class="math-key" data-cmd="Δ">Δ</button>
                    <button class="math-key" data-cmd="∞">∞</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="script.js"></script>
</body>
</html>
